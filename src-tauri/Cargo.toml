[package]
name = "focusdeck"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "focusdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tokio = { version = "1.53.3", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "json", "migrate", "macros"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
reqwest-eventsource = "0.6.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
git2 = "0.21.0"
keyring = "4.2.0"
notify = "8.2.0"
sysinfo = "0.39.6"
windows = "0.62.2"
enigo = "0.6.1"
arboard = "3.7.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
